<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Harsh Lakhara — Full-Stack Developer">
  <defs>
    <radialGradient id="og1" cx="18%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og2" cx="88%" cy="86%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogbase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>
    <linearGradient id="ogaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <pattern id="ogdots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#ogbase)"/>
  <rect width="1200" height="630" fill="url(#ogdots)"/>
  <rect width="1200" height="630" fill="url(#og1)"/>
  <rect width="1200" height="630" fill="url(#og2)"/>

  <g transform="translate(90, 96)">
    <rect width="72" height="72" rx="18" fill="#08090D" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="36" y="49" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="url(#ogaccent)">HL</text>
  </g>

  <text x="90" y="300" font-family="'JetBrains Mono', monospace" font-size="22" letter-spacing="6" fill="#A2A5B3">INDEPENDENT FULL-STACK DEVELOPER</text>
  <text x="86" y="380" font-family="'Space Grotesk', sans-serif" font-size="74" font-weight="700" fill="#F5F5F7">Harsh Lakhara</text>
  <text x="90" y="452" font-family="Inter, sans-serif" font-size="30" fill="#A2A5B3">Websites · Web Apps · Dashboards · Automation</text>

  <rect x="90" y="500" width="260" height="4" rx="2" fill="url(#ogaccent)"/>
</svg>
